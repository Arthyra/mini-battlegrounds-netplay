name: One-time v0.11.5 release metadata cleanup

on:
  push:
    paths:
      - .github/workflows/one-time-release-fix.yml

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-latest
    steps:
      - name: Correct the existing release title and factual qualifiers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = "lan-player-v0.11.5"
          endpoint = f"repos/{repo}/releases/tags/{tag}"
          release = json.loads(subprocess.check_output(["gh", "api", endpoint], text=True))
          body = release.get("body") or ""
          body = body.replace("（PC2 卡登录的根因）",
                              "（可解释类似 PC2 卡登录的静默失联症状；旧故障根因尚未完全证实）")
          body = body.replace("重连后地面亮格/无贴图问题根治",
                              "本机多轮重进地图未再出现亮格/无贴图现象，仍需长期验证")
          body = body.replace("房间发现覆盖全部上行网卡",
                              "房间发现覆盖多个可用 IPv4 子网")
          title = "v0.11.5 — 联机稳定性修复"
          subprocess.run(["gh", "api", "-X", "PATCH",
                          f"repos/{repo}/releases/{release['id']}",
                          "-f", f"name={title}", "-f", f"body={body}"], check=True)
          updated = json.loads(subprocess.check_output(["gh", "api", endpoint], text=True))
          assert updated["name"] == title
          assert updated["body"] == body
          print("Updated release title and qualified unsupported causal claims; assets unchanged.")
          PY
